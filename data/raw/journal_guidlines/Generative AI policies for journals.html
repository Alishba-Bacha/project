d journals","relatedBooks":"Related books","journalHomepage":"Journal Homepage","completeAnatomyTitle":"Complete Anatomy Articles","completeAnatomyDescription":"A collection of articles featuring written content and 2D images from Complete Anatomy, the world's most advanced 3D anatomy platform.\u003cbr/\u003e\u003cbr/\u003e\u003curl\u003eDownload Complete Anatomy\u003c/url\u003e from your app store for the full 3D experience.","allFiltersSidebarHeader":"All filters","globalNoResultsFound":"No results found for your search on \u003c0\u003eelsevier.com\u003c/0\u003e","articlePublishingChargesDiscover":"Discover Article publishing charges (APC)","articlePublishingChargesShowLess":"Show less","articlePublishingChargesLoading":"Loading...","seoGlobalSearchTitle":"Elsevier Site Search","seoGlobalSearchDescription":"Explore our inventory of products, discover innovative solutions and gain insights on various topics.","seoJournalCatalogTitle":"Elsevier Journal Catalog: Browse Peer-Reviewed Journals List","seoJournalCatalogDescription":"Browse through a wide range of high-quality academic journals offered by Elsevier, including open access options, to enrich your research journey.","articlePublishingChargesFallback":"No Article Publishing Charge data available for this Journal."},"webinar":{"title":"Webinar","register":"Register now","speaker":"Speaker","speakers":"Speakers","relatedResources":"Related resources","speaker_one":"Speaker","speaker_other":"Speakers"}},"en-us":{"article":{},"common":{},"book-companion":{},"contacts":{},"cookies":{},"download-page":{},"error":{},"footer":{},"forms":{},"form-labels":{},"header":{},"home":{},"locales":{},"preview":{},"search":{},"webinar":{}}},"initialLocale":"en-US","ns":["article","common","book-companion","contacts","cookies","download-page","error","footer","forms","form-labels","header","home","locales","preview","search","webinar"],"userConfig":null},"template":{"id":"basic-page","items":[{"component":"BasicPageHeader","id":"0e42462b-7bd4-42c6-bec9-c8d18d0be405"},{"component":"BasicPageContent","id":"a92a1c7c-b3bb-4dd5-9650-0c475447ca46"}],"analyticsPageType":"Generic Page"},"pageId":"1CAhacFlyPJQXM8pOI76Bk","breadcrumbs":[{"name":"Home","slug":"/"},{"name":"About","slug":"/en-US/about"},{"name":"Elsevier policies","slug":"/en-US/about/policies-and-standards"},{"name":"Generative AI policies for journals","slug":"/about/policies-and-standards/generative-ai-policies-for-journals"}],"contentId":"1MRKWjrElWdbJtyIKnJXxI","image":null,"pageComponentProps":{"0e42462b-7bd4-42c6-bec9-c8d18d0be405":{"props":{"label":null,"title":"Generative AI policies for journals","published":null,"image":null}},"a92a1c7c-b3bb-4dd5-9650-0c475447ca46":{"props":{"sections":[{"id":"0-About","name":"About","items":[{"id":"40CsRX8eMXHBH6MxwecSU2","componentProps":{"typeName":"RichTextFull","props":{"document":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"These policies were initially triggered by the rise of generative AI* and AI-assisted technologies, which were expected to increasingly be used by researchers and have now been updated to reflect evolving good practice. These policies aim to provide greater transparency and guidance to authors, reviewers, editors, readers and contributors. Elsevier will continue to monitor developments in this area and will adjust or refine policies as appropriate.\n","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"imageWithCaption":{"image":{"src":"","alt":"","width":0,"height":0},"caption":null},"callToActionLink":null}}}]},{"id":"1-For authors","name":"For authors","items":[{"id":"2AAvLSJMHPsLCWivqlypdA","componentProps":{"typeName":"RichTextFull","props":{"document":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"For authors","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"The use of generative AI and AI-assisted technologies in manuscript preparation - an overview","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"Elsevier recognizes the potential of generative AI and AI-assisted technologies (“AI Tools”), when used responsibly, to help researchers work efficiently, gain critical insights fast and achieve better outcomes. Increasingly, these tools, including AI agents and deep research tools, are helping researchers to synthesize complex literature, provide an overview of a field or research question, identify research gaps, generate ideas and provide tailored support for tasks such as content organization and improving language and readability. \n\nAuthors preparing a manuscript for an Elsevier journal can use AI Tools to support them. However, these tools must never be used as a substitute for human critical thinking, expertise and evaluation. AI Tools should always be applied with human oversight and control. \n\nUltimately, authors are responsible and accountable for the contents of their work. This includes accountability for:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Carefully reviewing and verifying the accuracy, comprehensiveness, and impartiality of all AI-generated output (including checking the sources, as AI-generated references can be incorrect or fabricated).","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Editing and adapting all material thoroughly to ensure the manuscript represents the author’s authentic and original contribution and reflects their own analysis, interpretation, insights and ideas.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Ensuring the use of any tools or sources, AI-based or otherwise, is made clear and transparent to readers — for the use of AI Tools we require a disclosure statement upon submission.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Ensuring the manuscript is developed in a way that safeguards data privacy, intellectual property and other rights, by checking the terms and conditions of any AI Tool that is used.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"Responsible use of AI Tools","nodeType":"text"}],"nodeType":"heading-4"},{"data":{},"content":[{"data":{},"marks":[],"value":"Authors must check the terms and conditions of any AI Tool that they use to ensure that the privacy and confidentiality of their data and inputs, including their unpublished manuscripts, is maintained. Particular care should be taken with any personally identifiable data. Images that duplicate or refer to existing copyrighted images, real people, or others’ identifiable products or brands must not be generated, nor any likeness of an individual’s voice. Authors should check for factual errors and for any potential bias. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Authors should also check the terms and conditions of any AI Tool they wish to use to ensure that, they only grant to the AI Tool the right to use their materials to provide the service to them and that they do not grant to the AI Tool any other rights to the materials that they input into the AI Tool (including without limitation the right to train the AI Tool on those materials). They must also ensure that the AI Tool does not impose constraints on the use of outputs from the AI Tool in a way that could restrict the subsequent publication of the relevant article. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Disclosure","nodeType":"text"}],"nodeType":"heading-4"},{"data":{},"content":[{"data":{},"marks":[],"value":"Authors should disclose the use of AI Tools for manuscript preparation in a separate AI declaration statement in their manuscript upon submission and a statement will appear in the published work. Authors should document their use of AI, including the name of the AI Tool used, the purpose of the use, and the extent of their oversight. Declaring the use of AI Tools supports transparency and trust between authors, readers, reviewers, editors and contributors and facilitates compliance with the terms of use of the relevant AI Tool. Basic checks of grammar, spelling and punctuation need no declaration. AI use in the research process should be declared and described in detail in the methods section.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Authorship","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":" ","nodeType":"text"}],"nodeType":"heading-4"},{"data":{},"content":[{"data":{},"marks":[],"value":"Authors should not list AI Tools as an author or co-author, nor cite AI Tools as an author. Authorship implies responsibilities and tasks that can only be attributed to and performed by humans. Each (co-) author is accountable for ensuring that questions related to the accuracy or integrity of any part of the work are appropriately investigated and resolved and authorship requires the ability to approve the final version of the work and agree to its submission. Authors are also responsible for ensuring that the work is original and has not been previously published, that the stated authors qualify for authorship, and the work does not infringe third party rights, and should familiarize themselves with Elsevier’s ","nodeType":"text"},{"data":{"uri":"/about/policies-and-standards/publishing-ethics"},"content":[{"data":{},"marks":[],"value":"Ethics in Publishing policy","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" before they submit.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The use of generative AI and AI-assisted tools in figures, images and artwork","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"We do not permit the use of Generative AI or AI-assisted tools to create or alter images in submitted manuscripts. This may include enhancing, obscuring, moving, removing, or introducing a specific feature within an image or figure. Adjustments of brightness, contrast, or color balance are acceptable if and as long as they do not obscure or eliminate any information present in the original. Image forensics tools or specialized software might be applied to submitted manuscripts to identify suspected image irregularities.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The only exception is if the use of AI or AI-assisted tools is part of the research design or research methods (such as in AI-assisted imaging approaches to generate or interpret the underlying research data, for example in the field of biomedical imaging). If this is done, such use must be described in a reproducible manner in the methods section. This should include an explanation of how the AI or AI-assisted tools were used in the image creation or alteration process, and the name of the model or tool, version and extension numbers, and manufacturer. Authors should adhere to the AI software’s specific usage policies and ensure correct content attribution. Where applicable, authors could be asked to provide pre-AI-adjusted versions of images and/or the composite raw images used to create the final submitted versions, for editorial assessment.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"The use of generative AI or AI-assisted tools in the production of artwork such as for graphical abstracts is not permitted. The use of generative AI in the production of cover art may in some cases be allowed, if the author obtains prior permission from the journal editor and publisher, can demonstrate that all necessary rights have been cleared for the use of the relevant material, and ensures that there is correct content attribution.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"imageWithCaption":{"image":{"src":"","alt":"","width":0,"height":0},"caption":null},"callToActionLink":{"href":null,"label":"View Elsevier’s generative AI author policies for books","accessibleLabel":null,"openInNewWindow":false,"page":{"slug":"/about/policies-and-standards/the-use-of-generative-ai-and-ai-assisted-technologies-in-writing-for-elsevier"}}}}}]},{"id":"2-For reviewers","name":"For reviewers","items":[{"id":"2WoDbXUXIRFVPOAKF1A8XY","componentProps":{"typeName":"RichTextFull","props":{"document":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"For reviewers","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"The use of generative AI and AI-assisted technologies in the journal peer review process","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"When a researcher is invited to review another researcher’s paper, the manuscript must be treated as a confidential document. Reviewers should not upload a submitted manuscript or any part of it into a generative AI tool as this may violate the authors’ confidentiality and proprietary rights and, where the paper contains personally identifiable information, may breach data privacy rights.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This confidentiality requirement extends to the peer review report, as it may contain confidential information about the manuscript and/or the authors. For this reason, reviewers should not upload their peer review report into an AI tool, even if it is just for the purpose of improving language and readability.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Peer review is at the heart of the scientific ecosystem and Elsevier abides by the highest standards of integrity in this process. Reviewing a scientific manuscript implies responsibilities that can only be attributed to humans. Generative AI or AI-assisted technologies should not be used by reviewers to assist in the scientific review of a paper as the critical thinking and original assessment needed for peer review is outside of the scope of this technology and there is a risk that the technology will generate incorrect, incomplete or biased conclusions about the manuscript. The reviewer is responsible and accountable for the content of the review report.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Elsevier’s AI author policy states that authors are allowed to use generative AI and AI-assisted technologies in the manuscript preparation process before submission, but only with appropriate oversight and disclosure, as per our instructions in Elsevier’s ","nodeType":"text"},{"data":{"uri":"https://www.sciencedirect.com/journal/journal-of-biotechnology/publish/guide-for-authors"},"content":[{"data":{},"marks":[],"value":"Guide for Authors","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":". Reviewers can find such disclosure at the bottom of the paper in a separate section before the list of references.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please note that Elsevier owns identity protected AI-assisted technologies which conform to the ","nodeType":"text"},{"data":{"uri":"https://www.relx.com/corporate-responsibility/being-a-responsible-business/responsible-ai"},"content":[{"data":{},"marks":[],"value":"RELX Responsible AI Principles","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":", such as those used during the screening process to conduct completeness and plagiarism checks and identify suitable reviewers. These in-house or licensed technologies respect author confidentiality. Our programs are subject to rigorous evaluation of bias and are compliant with data privacy and data security requirements. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Elsevier embraces new AI-driven technologies that support reviewers and editors in the editorial process, and we continue to develop and adopt in-house or licensed technologies that respect authors’, reviewers’ and editors’ confidentiality and data privacy rights.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"imageWithCaption":{"image":{"src":"","alt":"","width":0,"height":0},"caption":null},"callToActionLink":{"href":null,"label":"View Elsevier's generative AI reviewer policies for books","accessibleLabel":null,"openInNewWindow":false,"page":{"slug":"/about/policies-and-standards/the-use-of-generative-ai-and-ai-assisted-technologies-in-the-review-process"}}}}}]},{"id":"3-For editors","name":"For editors","items":[{"id":"5IQUznPbzsKpulXAtpbyUo","componentProps":{"typeName":"RichTextFull","props":{"document":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"For editors","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"The use of generative AI and AI-assisted technologies in the journal editorial process","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"A submitted manuscript must be treated as a confidential document. Editors should not upload a submitted manuscript or any part of it into a generative AI tool as this may violate the authors’ confidentiality and proprietary rights and, where the paper contains personally identifiable information, may breach data privacy rights. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"This confidentiality requirement extends to all communication about the manuscript including any notification or decision letters as they may contain confidential information about the manuscript and/or the authors. For this reason, editors should not upload their letters into an AI tool, even if it is just for the purpose of improving language and readability. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Peer review is at the heart of the scientific ecosystem and Elsevier abides by the highest standards of integrity in this process. Managing the editorial evaluation of a scientific manuscript implies responsibilities that can only be attributed to humans. Generative AI or AI-assisted technologies should not be used by editors to assist in the evaluation or decision-making process of a manuscript as the critical thinking and original assessment needed for this work is outside of the scope of this technology and there is a risk that the technology will generate incorrect, incomplete or biased conclusions about the manuscript. The editor is responsible and accountable for the editorial process, the final decision and the communication thereof to the authors. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"","nodeType":"text"},{"data":{"target":{"sys":{"id":"2GWyCcDjxp6JCkQaVlkCE1","type":"Link","linkType":"Entry"}},"content":{"sys":{"id":"2GWyCcDjxp6JCkQaVlkCE1"},"__typename":"Page","title":"Publishing ethics","slug":"/about/policies-and-standards/publishing-ethics"}},"content":[{"data":{},"marks":[],"value":"Elsevier’s AI author policy","nodeType":"text"}],"nodeType":"entry-hyperlink"},{"data":{},"marks":[],"value":" states that authors are allowed to use generative AI and AI-assisted technologies in the manuscript preparation process before submission, but only with appropriate oversight and disclosure, as per our instructions in Elsevier’s ","nodeType":"text"},{"data":{"uri":"https://www.sciencedirect.com/journal/journal-of-biotechnology/publish/guide-for-authors"},"content":[{"data":{},"marks":[],"value":"Guide for Authors","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":". Editors can find such disclosure at the bottom of the paper in a separate section before the list of references. If an editor suspects that an author or a reviewer has violated our AI policies, they should inform the publisher. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Please note that Elsevier owns identity protected AI-assisted technologies which conform to the ","nodeType":"text"},{"data":{"uri":"https://www.relx.com/corporate-responsibility/being-a-responsible-business/responsible-ai"},"content":[{"data":{},"marks":[],"value":"RELX Responsible AI Principles","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":", such as those used during the screening process to conduct completeness and plagiarism checks and identify suitable reviewers. These in-house or licensed technologies respect author confidentiality. Our programs are subject to rigorous evaluation of bias and are compliant with data privacy and data security requirements. ","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Elsevier embraces new AI-driven technologies that support reviewers and editors in the editorial process, and we continue to develop and adopt in-house or licensed technologies that respect authors’, reviewers’ and editors’ confidentiality and data privacy rights. ","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"imageWithCaption":{"image":{"src":"","alt":"","width":0,"height":0},"caption":null},"callToActionLink":{"href":null,"label":"View Elsevier's generative AI editor policies for books","accessibleLabel":null,"openInNewWindow":false,"page":{"slug":"/about/policies-and-standards/publishing-ethics-books/the-use-of-generative-ai-and-ai-assisted-technologies-in-the-editing-process"}}}}},{"id":"4voYYc3gOxTBlznwD4kqNu","componentProps":{"typeName":"RichTextFull","props":{"document":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[{"type":"italic"}],"value":"*Generative AI is a type of artificial intelligence technology that can produce various types of content including text, imagery, audio and synthetic data. Examples include ChatGPT, NovelAI, Jasper AI, Rytr AI, DALL-E, etc.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"italic"}],"value":"Policy updated updated September 2025.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"imageWithCaption":{"image":{"src":"","alt":"","width":0,"height":0},"caption":null},"callToActionLink":null,"variant":"content-callout"}}}]},{"id":"4-Publication process","name":"Publication process","items":[{"id":"5wAHhWUGg9VhrPLwyB8mSV","componentProps":{"typeName":"RichTextFull","props":{"document":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Publication process","nodeType":"text"}],"nodeType":"heading-2"},{"data":{},"content":[{"data":{},"marks":[],"value":"Elsevier's use of AI and AI-assisted technologies in the publication process","nodeType":"text"}],"nodeType":"heading-3"},{"data":{},"content":[{"data":{},"marks":[],"value":"\nAs part of our ongoing commitment to enhancing the experience for authors, reviewers, and editors of our journals, we are continually exploring innovative ways to improve the publication process. Our goal is to leverage the latest technology to support our experts in maintaining the highest quality of publications and preserving trust in the content we publish.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"How Elsevier currently uses AI in the publication process","nodeType":"text"}],"nodeType":"heading-4"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Our ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"editors ","nodeType":"text"},{"data":{},"marks":[],"value":"have access to AI tools ","nodeType":"text"},{"data":{"uri":"/editor/submission-systems/find-reviewers-tips"},"content":[{"data":{},"marks":[],"value":"that assist in identifying relevant reviewers","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":", matching the scope of submissions, and detecting duplicate submissions.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Our ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"authors","nodeType":"text"},{"data":{},"marks":[],"value":" are supported with tools such as ","nodeType":"text"},{"data":{"uri":"https://journalfinder.elsevier.com/"},"content":[{"data":{},"marks":[],"value":"our Journal Finder","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":", which help them identify suitable journals for their work. Additionally, if a paper is not accepted by the preferred journal, our ","nodeType":"text"},{"data":{"uri":"/researcher/author/submit-your-paper/submit-and-revise/article-transfer-service"},"content":[{"data":{},"marks":[],"value":"Article Transfer Service","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":" may suggest alternative publication options using expert recommendations or matching algorithms.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Our ","nodeType":"text"},{"data":{},"marks":[{"type":"bold"}],"value":"teams","nodeType":"text"},{"data":{},"marks":[],"value":" use AI tools to support them in:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Conducting technical checks of submitted papers, such as checking for adherence to submission guidelines and assessing for completeness.  ","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Performing research integrity checks to ensure compliance with our policies.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"},{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Supporting the post-acceptance stage of publication, including proof preparation, copy editing, and identifying inconsistencies or inaccuracies in the final paper.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"list-item"}],"nodeType":"unordered-list"}],"nodeType":"list-item"}],"nodeType":"unordered-list"},{"data":{},"content":[{"data":{},"marks":[],"value":"We are committed to ","nodeType":"text"},{"data":{"uri":"/about/policies-and-standards/responsible-ai-principles"},"content":[{"data":{},"marks":[],"value":"ensuring that human oversight remains at the core of decision-making","nodeType":"text"}],"nodeType":"hyperlink"},{"data":{},"marks":[],"value":". Our AI tools serve as a valuable support mechanism which empowers our experts to make informed decisions.\n\n*Please note that the range of AI use varies depending on the journal. If you have any questions, please contact the specific journal directly. ","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"},"imageWithCaption":{"image":{"src":"","alt":"","width":0,"height":0},"caption":null},"callToActionLink":null}}}]},{"id":"5-Frequently asked questions","name":"Frequently asked questions","items":[{"id":"41ABMimVcCeeP1UidwxWud","componentProps":{"typeName":"FrequentlyAskedQuestionsGroup","props":{"title":"Frequently asked questions","shortDescription":"Frequently asked questions","helpLink":null,"questions":[{"question":"Why has Elsevier decided that AI and AI-assisted tools cannot be credited as an author on published work?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Authorship implies responsibilities and tasks that can only be attributed to and performed by humans. Each (co-) author is accountable for ensuring that questions related to the accuracy or integrity of any part of the work are appropriately investigated and resolved and authorship requires the ability to approve the final version of the work and agree to its submission. Authors are also responsible for ensuring that the work is original, that the stated authors qualify for authorship, and the work does not infringe third party rights.","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[],"value":"Elsevier will monitor developments around generative AI and AI-assisted technologies and will adjust or refine this policy should it be appropriate.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}},{"question":"Does this policy cover tools that are used to check grammar and spelling, and reference managers that enable authors to collect and organize references to scholarly articles?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"No, this policy does not cover tools such as spelling or grammar checkers. In addition, the policy does not cover reference managers that enable authors to collect, organize, annotate and use references to scholarly articles — such as Mendeley, EndNote, Zotero and others. These tools can be used by authors without disclosure. This policy is specific to AI and AI-assisted tools, such as Large Language Models, which can generate output that may be used to create a scientific work.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}},{"question":"Does this policy refer to AI and AI-assisted tools that are used in the research process, for example to process data?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"No, this policy refers to generative AI and AI-assisted technologies, such as Large Language Models, when they are used during the scientific writing process. This policy does not prevent the use of AI and AI-assisted tools in formal research design or research methods. We recognize that this is common in many fields. Where AI or AI-assisted tools are used in this context, they should be described as part of the methodology of the work, with details provided in the Methods section.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}},{"question":"In which section of the manuscript should authors disclose the use of AI-assisted technologies, and where will this statement appear in the article if it is accepted for publication?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"We ask authors who have used AI or AI-assisted tools to insert a statement at the end of their manuscript, immediately above the references, entitled ‘Declaration of Generative AI and AI-assisted technologies in the writing process’. In that statement, we ask authors to specify the tool that was used and the reason for using the tool. We suggest that authors follow this format when preparing their statement:","nodeType":"text"}],"nodeType":"paragraph"},{"data":{},"content":[{"data":{},"marks":[{"type":"italic"}],"value":"During the preparation of this work the author(s) used [NAME TOOL / SERVICE] in order to [REASON]. After using this tool/service, the author(s) reviewed and edited the content as needed and take(s) full responsibility for the content of the publication.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}},{"question":"Can authors use AI-assisted tools to create or alter images that they publish in their work?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"It is not acceptable to enhance, obscure, move, remove, or introduce a specific feature within an image. Adjustments of brightness, contrast, or color balance are acceptable if and as long as they do not obscure or eliminate any information present in the original. Manipulating images for improved clarity is accepted, but manipulation for other purposes could be seen as scientific ethical abuse and will be dealt with accordingly. In consideration of this, we do not permit the use of AI or AI-assisted tools to create or alter images in submitted manuscripts. The only exception is if the use of AI or AI-assisted tools in the creation or alteration of images is part of the research design or research methods. If this is done, we require a clear description of the content that was created or altered, an explanation of how the AI or AI-assisted tools were used in the creation or alteration process, and the name of the model or tool, version and extension numbers, and manufacturer.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}},{"question":"How does Elsevier handle copyright if the authors credit an AI or AI-assisted tool in their article?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"AI and AI-assisted tools do not qualify for authorship under Elsevier’s authorship policy. Authors who use AI or AI-assisted tools during the manuscript writing process are asked to disclose their use in a separate section of the manuscript. The publishing agreement process works as usual, with the author transferring copyright to Elsevier or the society partner for subscription articles, and retaining copyright, granting a license to Elsevier and selecting an end user Creative Commons license for open access articles.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}},{"question":"Can you use output from AI agents or deep research directly as the text of your manuscript?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"No, you cannot use output from AI agents or deep research directly as the text of your manuscript. AI output can only serve as inspiration in the manuscript preparation process, and any manuscript needs to represent the authors' authentic and original contribution and reflect the authors' own analysis, interpretation and ideas. Researchers should carefully check all AI-generated output for factual accuracy, comprehensiveness, and impartiality, and verify all sources.","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}},{"question":"Does Elsevier allow the use of AI and AI-assisted technologies (“AI Tools”) tools, including AI agents and deep research, in the peer review and editorial decision-making process?","answer":{"text":{"data":{},"content":[{"data":{},"content":[{"data":{},"marks":[],"value":"Currently, Elsevier does not permit or enable the use of AI technologies in the peer review process, nor do we allow AI Tools to make editorial decisions. Human oversight remains at the core of our decision-making, and editors are ultimately responsible for all editorial outcomes. \n\nHowever, we are actively exploring how AI can support our in-house editors in tasks such as manuscript screening. We remain open to the potential benefits that AI technology may offer in enhancing the peer review process in the future. \n\nImportantly, we believe that technology should serve as an aid to reviewers and editors, never as a substitute for human expertise and oversight. Our commitment is to ensure that editorial integrity and quality are maintained through responsible use of emerging technologies.\n","nodeType":"text"}],"nodeType":"paragraph"}],"nodeType":"document"}}}]}}}]}],"templateVariant":null,"preview":false,"useTOC":false}}},"navigation":[{"id":"navigation-item-0","title":"Academic \u0026 Government","items":[{"title":"Expl
