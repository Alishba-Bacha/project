"_1bxw8d3"><div class="_1b5uz05"><a class="_1b5uz02 _16jmeqb1nk _16jmeqb1s _16jmeqbo _16jmeqb8 _16jmeqb1eo _1b5uz04 _16jmeqb1fg" href="https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals#1-for-authors" data-testid="jumplink-1"><span class="gv4p8b0 _1b5uz07 _16jmeqb14k _16jmeqb1ee _16jmeqb1ef _16jmeqbtg">For authors</span></a></div></li><li class="_1bxw8d3"><div class="_1b5uz05"><a class="_1b5uz02 _16jmeqb1nk _16jmeqb1s _16jmeqbo _16jmeqb8 _16jmeqb1eo _1b5uz03" href="https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals#2-for-reviewers" data-testid="jumplink-2"><span class="gv4p8b0 _1b5uz07 _16jmeqb14k _16jmeqb1ee _16jmeqb1ef _16jmeqbtg">For reviewers</span></a></div></li><li class="_1bxw8d3"><div class="_1b5uz05"><a class="_1b5uz02 _16jmeqb1nk _16jmeqb1s _16jmeqbo _16jmeqb8 _16jmeqb1eo _1b5uz03" href="https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals#3-for-editors" data-testid="jumplink-3"><span class="gv4p8b0 _1b5uz07 _16jmeqb14k _16jmeqb1ee _16jmeqb1ef _16jmeqbtg">For editors</span></a></div></li><li class="_1bxw8d3"><div class="_1b5uz05"><a class="_1b5uz02 _16jmeqb1nk _16jmeqb1s _16jmeqbo _16jmeqb8 _16jmeqb1eo _1b5uz03" href="https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals#4-publication-process" data-testid="jumplink-4"><span class="gv4p8b0 _1b5uz07 _16jmeqb14k _16jmeqb1ee _16jmeqb1ef _16jmeqbtg">Publication process</span></a></div></li><li class="_1bxw8d3"><div class="_1b5uz05"><a class="_1b5uz02 _16jmeqb1nk _16jmeqb1s _16jmeqbo _16jmeqb8 _16jmeqb1eo _1b5uz03" href="https://www.elsevier.com/about/policies-and-standards/generative-ai-policies-for-journals#5-frequently-asked-questions" data-testid="jumplink-5"><span class="gv4p8b0 _1b5uz07 _16jmeqb14k _16jmeqb1ee _16jmeqb1ef _16jmeqbtg">Frequently asked questions</span></a></div></li></ul><div class="_16jmeqb20 _16jmeqb1i _16jmeqb24"><div class="_1bxw8d5 _16jmeqb1do _16jmeqb24 _1b5uz09 _16jmeqb154 _1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:initial"><div class="_1bxw8d6 _16jmeqb1s _16jmeqb10 _16jmeqb8"><div class="_1bxw8d7"><button class="w17eg90 _16jmeqbxo _16jmeqbzw _16jmeqb124 _16jmeqb14c _16jmeqb1w _16jmeqbo _16jmeqb8 w17eg92 w17eg9d w17eg97 _1bxw8d9 _16jmeqb20" aria-hidden="true" tabindex="-1" data-testid="carousel-slide-button-left"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" fill-rule="evenodd" d="M7.125 11.438 15.563 3l1.312 1.313-7.125 7.125 7.125 7.124-1.313 1.313-8.437-8.438Z" clip-rule="evenodd"></path></svg><span class="_13sjisp0">Slide left</span></button></div><div class="_1bxw8d8"><button class="w17eg90 _16jmeqbxo _16jmeqbzw _16jmeqb124 _16jmeqb14c _16jmeqb1w _16jmeqbo _16jmeqb8 w17eg92 w17eg9d w17eg97 _1bxw8d9 _16jmeqb20" aria-hidden="true" tabindex="-1" data-testid="carousel-slide-button-right"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" fill-rule="evenodd" d="m7.125 18.563 7.125-7.125-7.125-7.126L8.438 3l8.437 8.438-8.438 8.437-1.312-1.313Z" clip-rule="evenodd"></path></svg><span class="_13sjisp0">Slide right</span></button></div></div></div></div></div></nav><div class="_16jmeqbk4 _16jmeqbk9 _16jmeqbkm _16jmeqbm4 _16jmeqbm9 _16jmeqbmm _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="_1lx5lep0" id="0-about"><div class="_16jmeqbk4 _16jmeqbk9 _16jmeqbkm _16jmeqbm4 _16jmeqbm9 _16jmeqbmm _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="section-rtf"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_16jmeqbjs _16jmeqbjy _16jmeqbls _16jmeqbly _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">These policies were initially triggered by the rise of generative AI* and AI-assisted technologies, which were expected to increasingly be used by researchers and have now been updated to reflect evolving good practice. These policies aim to provide greater transparency and guidance to authors, reviewers, editors, readers and contributors. Elsevier will continue to monitor developments in this area and will adjust or refine policies as appropriate.</p></div></div></div></div></div></div><div class="_1lx5lep0" id="1-for-authors"><div class="_16jmeqbk4 _16jmeqbk9 _16jmeqbkm _16jmeqbm4 _16jmeqbm9 _16jmeqbmm _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="section-rtf"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_16jmeqbjs _16jmeqbjy _16jmeqbls _16jmeqbly _16jmeqb1s _16jmeqb18 _16jmeqb0"><h2 class="m0fuh0 m0fuh0 tlzusk2 tlzuske tlzuskv _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="2">For authors</h2><h3 class="m0fuh0 m0fuh0 tlzusk3 tlzuskf tlzuskq tlzuskw _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="3">The use of generative AI and AI-assisted technologies in manuscript preparation - an overview</h3><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Elsevier recognizes the potential of generative AI and AI-assisted technologies (“AI Tools”), when used responsibly, to help researchers work efficiently, gain critical insights fast and achieve better outcomes. Increasingly, these tools, including AI agents and deep research tools, are helping researchers to synthesize complex literature, provide an overview of a field or research question, identify research gaps, generate ideas and provide tailored support for tasks such as content organization and improving language and readability. 

Authors preparing a manuscript for an Elsevier journal can use AI Tools to support them. However, these tools must never be used as a substitute for human critical thinking, expertise and evaluation. AI Tools should always be applied with human oversight and control. 

Ultimately, authors are responsible and accountable for the contents of their work. This includes accountability for:</p><ul class="_1w1hhao0 _16jmeqb18 _16jmeqb1s _16jmeqbjc" role="list"><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Carefully reviewing and verifying the accuracy, comprehensiveness, and impartiality of all AI-generated output (including checking the sources, as AI-generated references can be incorrect or fabricated).</p></div></div></li><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Editing and adapting all material thoroughly to ensure the manuscript represents the author’s authentic and original contribution and reflects their own analysis, interpretation, insights and ideas.</p></div></div></li><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Ensuring the use of any tools or sources, AI-based or otherwise, is made clear and transparent to readers — for the use of AI Tools we require a disclosure statement upon submission.</p></div></div></li><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Ensuring the manuscript is developed in a way that safeguards data privacy, intellectual property and other rights, by checking the terms and conditions of any AI Tool that is used.</p></div></div></li></ul><h4 class="m0fuh0 m0fuh0 tlzusk4 tlzuskg tlzuskr tlzuskx _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="4">Responsible use of AI Tools</h4><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Authors must check the terms and conditions of any AI Tool that they use to ensure that the privacy and confidentiality of their data and inputs, including their unpublished manuscripts, is maintained. Particular care should be taken with any personally identifiable data. Images that duplicate or refer to existing copyrighted images, real people, or others’ identifiable products or brands must not be generated, nor any likeness of an individual’s voice. Authors should check for factual errors and for any potential bias. </p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Authors should also check the terms and conditions of any AI Tool they wish to use to ensure that, they only grant to the AI Tool the right to use their materials to provide the service to them and that they do not grant to the AI Tool any other rights to the materials that they input into the AI Tool (including without limitation the right to train the AI Tool on those materials). They must also ensure that the AI Tool does not impose constraints on the use of outputs from the AI Tool in a way that could restrict the subsequent publication of the relevant article. </p><h4 class="m0fuh0 m0fuh0 tlzusk4 tlzuskg tlzuskr tlzuskx _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="4">Disclosure</h4><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Authors should disclose the use of AI Tools for manuscript preparation in a separate AI declaration statement in their manuscript upon submission and a statement will appear in the published work. Authors should document their use of AI, including the name of the AI Tool used, the purpose of the use, and the extent of their oversight. Declaring the use of AI Tools supports transparency and trust between authors, readers, reviewers, editors and contributors and facilitates compliance with the terms of use of the relevant AI Tool. Basic checks of grammar, spelling and punctuation need no declaration. AI use in the research process should be declared and described in detail in the methods section.</p><h4 class="m0fuh0 m0fuh0 tlzusk4 tlzuskg tlzuskr tlzuskx _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="4">Authorship<b> </b></h4><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Authors should not list AI Tools as an author or co-author, nor cite AI Tools as an author. Authorship implies responsibilities and tasks that can only be attributed to and performed by humans. Each (co-) author is accountable for ensuring that questions related to the accuracy or integrity of any part of the work are appropriately investigated and resolved and authorship requires the ability to approve the final version of the work and agree to its submission. Authors are also responsible for ensuring that the work is original and has not been previously published, that the stated authors qualify for authorship, and the work does not infringe third party rights, and should familiarize themselves with Elsevier’s <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.elsevier.com/about/policies-and-standards/publishing-ethics"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">Ethics in Publishing policy</span></a> before they submit.</p><h3 class="m0fuh0 m0fuh0 tlzusk3 tlzuskf tlzuskq tlzuskw _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="3">The use of generative AI and AI-assisted tools in figures, images and artwork</h3><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">We do not permit the use of Generative AI or AI-assisted tools to create or alter images in submitted manuscripts. This may include enhancing, obscuring, moving, removing, or introducing a specific feature within an image or figure. Adjustments of brightness, contrast, or color balance are acceptable if and as long as they do not obscure or eliminate any information present in the original. Image forensics tools or specialized software might be applied to submitted manuscripts to identify suspected image irregularities.</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">The only exception is if the use of AI or AI-assisted tools is part of the research design or research methods (such as in AI-assisted imaging approaches to generate or interpret the underlying research data, for example in the field of biomedical imaging). If this is done, such use must be described in a reproducible manner in the methods section. This should include an explanation of how the AI or AI-assisted tools were used in the image creation or alteration process, and the name of the model or tool, version and extension numbers, and manufacturer. Authors should adhere to the AI software’s specific usage policies and ensure correct content attribution. Where applicable, authors could be asked to provide pre-AI-adjusted versions of images and/or the composite raw images used to create the final submitted versions, for editorial assessment.</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">The use of generative AI or AI-assisted tools in the production of artwork such as for graphical abstracts is not permitted. The use of generative AI in the production of cover art may in some cases be allowed, if the author obtains prior permission from the journal editor and publisher, can demonstrate that all necessary rights have been cleared for the use of the relevant material, and ensures that there is correct content attribution.</p></div></div><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb8 _16jmeqbbc"><a class="_1d3he28c _16jmeqb1o _16jmeqbo _16jmeqb8 _16jmeqb1nk _16jmeqb1lg _16jmeqb1ll _16jmeqb1lq _16jmeqb1lv _16jmeqb1oi _1d3he285 _16jmeqb1go _16jmeqb1gy _16jmeqb1h3 _16jmeqb1io _16jmeqb1j3 _16jmeqb1lv _16jmeqbxc _16jmeqbzk _16jmeqb11s _16jmeqb140 _16jmeqb1w _16jmeqb28 _16jmeqb4" href="https://www.elsevier.com/about/policies-and-standards/the-use-of-generative-ai-and-ai-assisted-technologies-in-writing-for-elsevier"><div class="_1d3he282"><span class="_16jmeqb1w _16jmeqb10 _16jmeqb8 _16jmeqb1nk _16jmeqb1nl"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="" style="padding-inline: var(--_99wljg5e);">View Elsevier’s generative AI author policies for books</div></span></span></div></a></div></div></div></div></div><div class="_1lx5lep0" id="2-for-reviewers"><div class="_16jmeqbk4 _16jmeqbk9 _16jmeqbkm _16jmeqbm4 _16jmeqbm9 _16jmeqbmm _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="section-rtf"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_16jmeqbjs _16jmeqbjy _16jmeqbls _16jmeqbly _16jmeqb1s _16jmeqb18 _16jmeqb0"><h2 class="m0fuh0 m0fuh0 tlzusk2 tlzuske tlzuskv _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="2">For reviewers</h2><h3 class="m0fuh0 m0fuh0 tlzusk3 tlzuskf tlzuskq tlzuskw _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="3">The use of generative AI and AI-assisted technologies in the journal peer review process</h3><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">When a researcher is invited to review another researcher’s paper, the manuscript must be treated as a confidential document. Reviewers should not upload a submitted manuscript or any part of it into a generative AI tool as this may violate the authors’ confidentiality and proprietary rights and, where the paper contains personally identifiable information, may breach data privacy rights.</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">This confidentiality requirement extends to the peer review report, as it may contain confidential information about the manuscript and/or the authors. For this reason, reviewers should not upload their peer review report into an AI tool, even if it is just for the purpose of improving language and readability.</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Peer review is at the heart of the scientific ecosystem and Elsevier abides by the highest standards of integrity in this process. Reviewing a scientific manuscript implies responsibilities that can only be attributed to humans. Generative AI or AI-assisted technologies should not be used by reviewers to assist in the scientific review of a paper as the critical thinking and original assessment needed for peer review is outside of the scope of this technology and there is a risk that the technology will generate incorrect, incomplete or biased conclusions about the manuscript. The reviewer is responsible and accountable for the content of the review report.</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Elsevier’s AI author policy states that authors are allowed to use generative AI and AI-assisted technologies in the manuscript preparation process before submission, but only with appropriate oversight and disclosure, as per our instructions in Elsevier’s <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.sciencedirect.com/journal/journal-of-biotechnology/publish/guide-for-authors" rel="noopener" target="_blank" aria-label="Guide for Authors opens in new tab/window"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">Guide for Authors<span class="gv4p8b0 _17x85qk1 _16jmeqb1ee _16jmeqb1ef"><svg viewBox="0 0 24 24" class=" nddnvd1 nddnvd8 _17x85qk0"><path fill="currentColor" fill-rule="evenodd" d="M5.438 6.75h10.7L4.983 17.906l1.326 1.328 11.13-11.13V18.75h1.875V4.875H5.438V6.75Z" clip-rule="evenodd"></path></svg></span></span></a>. Reviewers can find such disclosure at the bottom of the paper in a separate section before the list of references.</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Please note that Elsevier owns identity protected AI-assisted technologies which conform to the <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.relx.com/corporate-responsibility/being-a-responsible-business/responsible-ai" rel="noopener" target="_blank" aria-label="RELX Responsible AI Principles opens in new tab/window"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">RELX Responsible AI Principles<span class="gv4p8b0 _17x85qk1 _16jmeqb1ee _16jmeqb1ef"><svg viewBox="0 0 24 24" class=" nddnvd1 nddnvd8 _17x85qk0"><path fill="currentColor" fill-rule="evenodd" d="M5.438 6.75h10.7L4.983 17.906l1.326 1.328 11.13-11.13V18.75h1.875V4.875H5.438V6.75Z" clip-rule="evenodd"></path></svg></span></span></a>, such as those used during the screening process to conduct completeness and plagiarism checks and identify suitable reviewers. These in-house or licensed technologies respect author confidentiality. Our programs are subject to rigorous evaluation of bias and are compliant with data privacy and data security requirements. </p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Elsevier embraces new AI-driven technologies that support reviewers and editors in the editorial process, and we continue to develop and adopt in-house or licensed technologies that respect authors’, reviewers’ and editors’ confidentiality and data privacy rights.</p></div></div><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb8 _16jmeqbbc"><a class="_1d3he28c _16jmeqb1o _16jmeqbo _16jmeqb8 _16jmeqb1nk _16jmeqb1lg _16jmeqb1ll _16jmeqb1lq _16jmeqb1lv _16jmeqb1oi _1d3he285 _16jmeqb1go _16jmeqb1gy _16jmeqb1h3 _16jmeqb1io _16jmeqb1j3 _16jmeqb1lv _16jmeqbxc _16jmeqbzk _16jmeqb11s _16jmeqb140 _16jmeqb1w _16jmeqb28 _16jmeqb4" href="https://www.elsevier.com/about/policies-and-standards/the-use-of-generative-ai-and-ai-assisted-technologies-in-the-review-process"><div class="_1d3he282"><span class="_16jmeqb1w _16jmeqb10 _16jmeqb8 _16jmeqb1nk _16jmeqb1nl"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="" style="padding-inline: var(--_99wljg5e);">View Elsevier's generative AI reviewer policies for books</div></span></span></div></a></div></div></div></div></div><div class="_1lx5lep0" id="3-for-editors"><div class="_16jmeqbk4 _16jmeqbk9 _16jmeqbkm _16jmeqbm4 _16jmeqbm9 _16jmeqbmm _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="section-rtf"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_16jmeqbjs _16jmeqbjy _16jmeqbls _16jmeqbly _16jmeqb1s _16jmeqb18 _16jmeqb0"><h2 class="m0fuh0 m0fuh0 tlzusk2 tlzuske tlzuskv _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="2">For editors</h2><h3 class="m0fuh0 m0fuh0 tlzusk3 tlzuskf tlzuskq tlzuskw _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="3">The use of generative AI and AI-assisted technologies in the journal editorial process</h3><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">A submitted manuscript must be treated as a confidential document. Editors should not upload a submitted manuscript or any part of it into a generative AI tool as this may violate the authors’ confidentiality and proprietary rights and, where the paper contains personally identifiable information, may breach data privacy rights. </p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">This confidentiality requirement extends to all communication about the manuscript including any notification or decision letters as they may contain confidential information about the manuscript and/or the authors. For this reason, editors should not upload their letters into an AI tool, even if it is just for the purpose of improving language and readability. </p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Peer review is at the heart of the scientific ecosystem and Elsevier abides by the highest standards of integrity in this process. Managing the editorial evaluation of a scientific manuscript implies responsibilities that can only be attributed to humans. Generative AI or AI-assisted technologies should not be used by editors to assist in the evaluation or decision-making process of a manuscript as the critical thinking and original assessment needed for this work is outside of the scope of this technology and there is a risk that the technology will generate incorrect, incomplete or biased conclusions about the manuscript. The editor is responsible and accountable for the editorial process, the final decision and the communication thereof to the authors. </p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5"><a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.elsevier.com/about/policies-and-standards/publishing-ethics"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">Elsevier’s AI author policy</span></a> states that authors are allowed to use generative AI and AI-assisted technologies in the manuscript preparation process before submission, but only with appropriate oversight and disclosure, as per our instructions in Elsevier’s <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.sciencedirect.com/journal/journal-of-biotechnology/publish/guide-for-authors" rel="noopener" target="_blank" aria-label="Guide for Authors opens in new tab/window"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">Guide for Authors<span class="gv4p8b0 _17x85qk1 _16jmeqb1ee _16jmeqb1ef"><svg viewBox="0 0 24 24" class=" nddnvd1 nddnvd8 _17x85qk0"><path fill="currentColor" fill-rule="evenodd" d="M5.438 6.75h10.7L4.983 17.906l1.326 1.328 11.13-11.13V18.75h1.875V4.875H5.438V6.75Z" clip-rule="evenodd"></path></svg></span></span></a>. Editors can find such disclosure at the bottom of the paper in a separate section before the list of references. If an editor suspects that an author or a reviewer has violated our AI policies, they should inform the publisher. </p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Please note that Elsevier owns identity protected AI-assisted technologies which conform to the <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.relx.com/corporate-responsibility/being-a-responsible-business/responsible-ai" rel="noopener" target="_blank" aria-label="RELX Responsible AI Principles opens in new tab/window"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">RELX Responsible AI Principles<span class="gv4p8b0 _17x85qk1 _16jmeqb1ee _16jmeqb1ef"><svg viewBox="0 0 24 24" class=" nddnvd1 nddnvd8 _17x85qk0"><path fill="currentColor" fill-rule="evenodd" d="M5.438 6.75h10.7L4.983 17.906l1.326 1.328 11.13-11.13V18.75h1.875V4.875H5.438V6.75Z" clip-rule="evenodd"></path></svg></span></span></a>, such as those used during the screening process to conduct completeness and plagiarism checks and identify suitable reviewers. These in-house or licensed technologies respect author confidentiality. Our programs are subject to rigorous evaluation of bias and are compliant with data privacy and data security requirements. </p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Elsevier embraces new AI-driven technologies that support reviewers and editors in the editorial process, and we continue to develop and adopt in-house or licensed technologies that respect authors’, reviewers’ and editors’ confidentiality and data privacy rights. </p></div></div><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb8 _16jmeqbbc"><a class="_1d3he28c _16jmeqb1o _16jmeqbo _16jmeqb8 _16jmeqb1nk _16jmeqb1lg _16jmeqb1ll _16jmeqb1lq _16jmeqb1lv _16jmeqb1oi _1d3he285 _16jmeqb1go _16jmeqb1gy _16jmeqb1h3 _16jmeqb1io _16jmeqb1j3 _16jmeqb1lv _16jmeqbxc _16jmeqbzk _16jmeqb11s _16jmeqb140 _16jmeqb1w _16jmeqb28 _16jmeqb4" href="https://www.elsevier.com/about/policies-and-standards/publishing-ethics-books/the-use-of-generative-ai-and-ai-assisted-technologies-in-the-editing-process"><div class="_1d3he282"><span class="_16jmeqb1w _16jmeqb10 _16jmeqb8 _16jmeqb1nk _16jmeqb1nl"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="" style="padding-inline: var(--_99wljg5e);">View Elsevier's generative AI editor policies for books</div></span></span></div></a></div></div></div><div class="section-rtf"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="_166ug2a0"><div class="_16jmeqb3s _16jmeqb7s _16jmeqb1kg"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_16jmeqbjs _16jmeqbjy _16jmeqbls _16jmeqbly _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5"><i>*Generative AI is a type of artificial intelligence technology that can produce various types of content including text, imagery, audio and synthetic data. Examples include ChatGPT, NovelAI, Jasper AI, Rytr AI, DALL-E, etc.</i></p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5"><i>Policy updated updated September 2025.</i></p></div></div></div></div></div></div></div></div></div><div class="_1lx5lep0" id="4-publication-process"><div class="_16jmeqbk4 _16jmeqbk9 _16jmeqbkm _16jmeqbm4 _16jmeqbm9 _16jmeqbmm _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="section-rtf"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_16jmeqbjs _16jmeqbjy _16jmeqbls _16jmeqbly _16jmeqb1s _16jmeqb18 _16jmeqb0"><h2 class="m0fuh0 m0fuh0 tlzusk2 tlzuske tlzuskv _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="2">Publication process</h2><h3 class="m0fuh0 m0fuh0 tlzusk3 tlzuskf tlzuskq tlzuskw _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="3">Elsevier's use of AI and AI-assisted technologies in the publication process</h3><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">
As part of our ongoing commitment to enhancing the experience for authors, reviewers, and editors of our journals, we are continually exploring innovative ways to improve the publication process. Our goal is to leverage the latest technology to support our experts in maintaining the highest quality of publications and preserving trust in the content we publish.</p><h4 class="m0fuh0 m0fuh0 tlzusk4 tlzuskg tlzuskr tlzuskx _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="4">How Elsevier currently uses AI in the publication process</h4><ul class="_1w1hhao0 _16jmeqb18 _16jmeqb1s _16jmeqbjc" role="list"><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Our <b>editors </b>have access to AI tools <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.elsevier.com/editor/submission-systems/find-reviewers-tips"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">that assist in identifying relevant reviewers</span></a>, matching the scope of submissions, and detecting duplicate submissions.</p></div></div></li><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Our <b>authors</b> are supported with tools such as <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://journalfinder.elsevier.com/" rel="noopener" target="_blank" aria-label="our Journal Finder opens in new tab/window"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">our Journal Finder<span class="gv4p8b0 _17x85qk1 _16jmeqb1ee _16jmeqb1ef"><svg viewBox="0 0 24 24" class=" nddnvd1 nddnvd8 _17x85qk0"><path fill="currentColor" fill-rule="evenodd" d="M5.438 6.75h10.7L4.983 17.906l1.326 1.328 11.13-11.13V18.75h1.875V4.875H5.438V6.75Z" clip-rule="evenodd"></path></svg></span></span></a>, which help them identify suitable journals for their work. Additionally, if a paper is not accepted by the preferred journal, our <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.elsevier.com/researcher/author/submit-your-paper/submit-and-revise/article-transfer-service"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">Article Transfer Service</span></a> may suggest alternative publication options using expert recommendations or matching algorithms.</p></div></div></li><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Our <b>teams</b> use AI tools to support them in:</p><ul class="_1w1hhao0 _16jmeqb18 _16jmeqb1s _16jmeqbjc" role="list"><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Conducting technical checks of submitted papers, such as checking for adherence to submission guidelines and assessing for completeness.  </p></div></div></li><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Performing research integrity checks to ensure compliance with our policies.</p></div></div></li><li class=""><div class="_16jmeqbj4 _16jmeqbl4 _16jmeqb1s _16jmeqb10 _16jmeqb4"><span class="_1w1hhao3 _16jmeqbsw _16jmeqb1gg _16jmeqb1w _16jmeqbo _16jmeqb1gg _16jmeqb8" aria-hidden="true"><span class="_16jmeqb1s _16jmeqb10 _16jmeqb8"><svg fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6.3"></circle></svg></span></span><div class="_16jmeqbt8"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Supporting the post-acceptance stage of publication, including proof preparation, copy editing, and identifying inconsistencies or inaccuracies in the final paper.</p></div></div></li></ul></div></div></li></ul><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">We are committed to <a class="_16jmeqb1k _16jmeqb1hk _16jmeqb1nk _16jmeqb1np" href="https://www.elsevier.com/about/policies-and-standards/responsible-ai-principles"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef">ensuring that human oversight remains at the core of decision-making</span></a>. Our AI tools serve as a valuable support mechanism which empowers our experts to make informed decisions.

*Please note that the range of AI use varies depending on the journal. If you have any questions, please contact the specific journal directly. </p></div></div></div></div></div></div><div class="_1lx5lep0" id="5-frequently-asked-questions"><div class="_16jmeqbk4 _16jmeqbk9 _16jmeqbkm _16jmeqbm4 _16jmeqbm9 _16jmeqbmm _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class=""><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgh)"><div class="_1u13v720 _16jmeqbk0 _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4 _16jmeqbq6"><div class="_16jmeqbjy _16jmeqbjt _16jmeqbjk _16jmeqbly _16jmeqblt _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><h2 class="m0fuh0 m0fuh0 tlzusk3 tlzuskf tlzuskq tlzuskw _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="3">Frequently asked questions</h2>Frequently asked questions</div></div><div class="_16jmeqbo8 _16jmeqboc _16jmeqbou _16jmeqbr4" data-testid="faq"><div class="" role="region"><div class="_16jmeqbjs _16jmeqbjy _16jmeqbls _16jmeqbly _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-1-why-has-elsevier-decided-that-ai-and-ai-assisted-tools-cannot-be-credited-as-an-author-on-published-work"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">Why has Elsevier decided that AI and AI-assisted tools cannot be credited as an author on published work?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-1-why-has-elsevier-decided-that-ai-and-ai-assisted-tools-cannot-be-credited-as-an-author-on-published-work"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Authorship implies responsibilities and tasks that can only be attributed to and performed by humans. Each (co-) author is accountable for ensuring that questions related to the accuracy or integrity of any part of the work are appropriately investigated and resolved and authorship requires the ability to approve the final version of the work and agree to its submission. Authors are also responsible for ensuring that the work is original, that the stated authors qualify for authorship, and the work does not infringe third party rights.</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Elsevier will monitor developments around generative AI and AI-assisted technologies and will adjust or refine this policy should it be appropriate.</p></div></div></div></div></div></div></div></div><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-2-does-this-policy-cover-tools-that-are-used-to-check-grammar-and-spelling-and-reference-managers-that-enable-authors-to-collect-and-organize-references-to-scholarly-articles"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">Does this policy cover tools that are used to check grammar and spelling, and reference managers that enable authors to collect and organize references to scholarly articles?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-2-does-this-policy-cover-tools-that-are-used-to-check-grammar-and-spelling-and-reference-managers-that-enable-authors-to-collect-and-organize-references-to-scholarly-articles"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">No, this policy does not cover tools such as spelling or grammar checkers. In addition, the policy does not cover reference managers that enable authors to collect, organize, annotate and use references to scholarly articles — such as Mendeley, EndNote, Zotero and others. These tools can be used by authors without disclosure. This policy is specific to AI and AI-assisted tools, such as Large Language Models, which can generate output that may be used to create a scientific work.</p></div></div></div></div></div></div></div></div><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-3-does-this-policy-refer-to-ai-and-ai-assisted-tools-that-are-used-in-the-research-process-for-example-to-process-data"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">Does this policy refer to AI and AI-assisted tools that are used in the research process, for example to process data?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-3-does-this-policy-refer-to-ai-and-ai-assisted-tools-that-are-used-in-the-research-process-for-example-to-process-data"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">No, this policy refers to generative AI and AI-assisted technologies, such as Large Language Models, when they are used during the scientific writing process. This policy does not prevent the use of AI and AI-assisted tools in formal research design or research methods. We recognize that this is common in many fields. Where AI or AI-assisted tools are used in this context, they should be described as part of the methodology of the work, with details provided in the Methods section.</p></div></div></div></div></div></div></div></div><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-4-in-which-section-of-the-manuscript-should-authors-disclose-the-use-of-ai-assisted-technologies-and-where-will-this-statement-appear-in-the-article-if-it-is-accepted-for-publication"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">In which section of the manuscript should authors disclose the use of AI-assisted technologies, and where will this statement appear in the article if it is accepted for publication?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-4-in-which-section-of-the-manuscript-should-authors-disclose-the-use-of-ai-assisted-technologies-and-where-will-this-statement-appear-in-the-article-if-it-is-accepted-for-publication"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">We ask authors who have used AI or AI-assisted tools to insert a statement at the end of their manuscript, immediately above the references, entitled ‘Declaration of Generative AI and AI-assisted technologies in the writing process’. In that statement, we ask authors to specify the tool that was used and the reason for using the tool. We suggest that authors follow this format when preparing their statement:</p><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5"><i>During the preparation of this work the author(s) used [NAME TOOL / SERVICE] in order to [REASON]. After using this tool/service, the author(s) reviewed and edited the content as needed and take(s) full responsibility for the content of the publication.</i></p></div></div></div></div></div></div></div></div><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-5-can-authors-use-ai-assisted-tools-to-create-or-alter-images-that-they-publish-in-their-work"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">Can authors use AI-assisted tools to create or alter images that they publish in their work?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-5-can-authors-use-ai-assisted-tools-to-create-or-alter-images-that-they-publish-in-their-work"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">It is not acceptable to enhance, obscure, move, remove, or introduce a specific feature within an image. Adjustments of brightness, contrast, or color balance are acceptable if and as long as they do not obscure or eliminate any information present in the original. Manipulating images for improved clarity is accepted, but manipulation for other purposes could be seen as scientific ethical abuse and will be dealt with accordingly. In consideration of this, we do not permit the use of AI or AI-assisted tools to create or alter images in submitted manuscripts. The only exception is if the use of AI or AI-assisted tools in the creation or alteration of images is part of the research design or research methods. If this is done, we require a clear description of the content that was created or altered, an explanation of how the AI or AI-assisted tools were used in the creation or alteration process, and the name of the model or tool, version and extension numbers, and manufacturer.</p></div></div></div></div></div></div></div></div><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-6-how-does-elsevier-handle-copyright-if-the-authors-credit-an-ai-or-ai-assisted-tool-in-their-article"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">How does Elsevier handle copyright if the authors credit an AI or AI-assisted tool in their article?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-6-how-does-elsevier-handle-copyright-if-the-authors-credit-an-ai-or-ai-assisted-tool-in-their-article"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">AI and AI-assisted tools do not qualify for authorship under Elsevier’s authorship policy. Authors who use AI or AI-assisted tools during the manuscript writing process are asked to disclose their use in a separate section of the manuscript. The publishing agreement process works as usual, with the author transferring copyright to Elsevier or the society partner for subscription articles, and retaining copyright, granting a license to Elsevier and selecting an end user Creative Commons license for open access articles.</p></div></div></div></div></div></div></div></div><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-7-can-you-use-output-from-ai-agents-or-deep-research-directly-as-the-text-of-your-manuscript"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">Can you use output from AI agents or deep research directly as the text of your manuscript?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-7-can-you-use-output-from-ai-agents-or-deep-research-directly-as-the-text-of-your-manuscript"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">No, you cannot use output from AI agents or deep research directly as the text of your manuscript. AI output can only serve as inspiration in the manuscript preparation process, and any manuscript needs to represent the authors' authentic and original contribution and reflect the authors' own analysis, interpretation and ideas. Researchers should carefully check all AI-generated output for factual accuracy, comprehensiveness, and impartiality, and verify all sources.</p></div></div></div></div></div></div></div></div><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0 _16jmeqb7c _16jmeqb1s0"><button class="ou5ptd0 _16jmeqb14g _16jmeqb1fg" type="button" aria-expanded="false" aria-controls="faq-25-8-does-elsevier-allow-the-use-of-ai-and-ai-assisted-technologies-ai-tools-tools-including-ai-agents-and-deep-research-in-the-peer-review-and-editorial-decision-making-process"><div class="_16jmeqbjs _16jmeqbls _16jmeqb1s _16jmeqb10 _16jmeqb4 _16jmeqbw"><h3 class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md">Does Elsevier allow the use of AI and AI-assisted technologies (“AI Tools”) tools, including AI agents and deep research, in the peer review and editorial decision-making process?</h3><svg viewBox="0 0 24 24" class=" nddnvd5 nddnvd7 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="M3.563 9.563 4.875 8.25 12 15.375l7.125-7.125 1.313 1.313L12 18 3.562 9.562Z" clip-rule="evenodd"></path></svg></div></button><div class="" hidden="" id="faq-25-8-does-elsevier-allow-the-use-of-ai-and-ai-assisted-technologies-ai-tools-tools-including-ai-agents-and-deep-research-in-the-peer-review-and-editorial-decision-making-process"><div class="ou5ptd1 _16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><div class="gv4p8b0 tlzusk8 tlzuskk _16jmeqb1ee _16jmeqb1ef" data-text-size="md"><div class="_1u13v720 _16jmeqbjg _16jmeqbjl _16jmeqbjq _16jmeqblg _16jmeqbll _16jmeqblq" style="grid-template-columns:repeat(12, 1fr)"><div class="_16jmeqbo8 _16jmeqboc _16jmeqbr4"><div class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><div class="_16jmeqbjk _16jmeqblk _16jmeqb1s _16jmeqb18 _16jmeqb0"><p class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef _16jmeqb1f5">Currently, Elsevier does not permit or enable the use of AI technologies in the peer review process, nor do we allow AI Tools to make editorial decisions. Human oversight remains at the core of our decision-making, and editors are ultimately responsible for all editorial outcomes. 

However, we are actively exploring how AI can support our in-house editors in tasks such as manuscript screening. We remain open to the potential benefits that AI technology may offer in enhancing the peer review process in the future. 

Importantly, we believe that technology should serve as an aid to reviewers and editors, never as a substitute for human expertise and oversight. Our commitment is to ensure that editorial integrity and quality are maintained through responsible use of emerging technologies.</p></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div><script data-testid="json-ld" type="application/ld+json">{"@context":"https://schema.org/","@type":"WebPage","headline":"Generative AI policies for journals","description":"Discover Elsevier's generative AI policies for journals. Learn how we address AI-assisted technologies and ensure research integrity in publishing.","breadcrumb":{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"/","name":"Home"}},{"@type":"ListItem","position":2,"item":{"@id":"/en-US/about","name":"About"}},{"@type":"ListItem","position":3,"item":{"@id":"/en-US/about/policies-and-standards","name":"Elsevier policies"}},{"@type":"ListItem","position":4,"item":{"@id":"/about/policies-and-standards/generative-ai-policies-for-journals","name":"Generative AI policies for journals"}}]}}</script><script data-testid="json-ld" type="application/ld+json">{"@context":"https://schema.org/","@type":"WebSite","name":"Elsevier","url":"https://www.elsevier.com","potentialAction":{"@type":"SearchAction","target":"https://www.elsevier.com/search?query={query}","query-input":"required name=query"}}</script></main><footer class="_99wljg93 _16jmeqb1i4 _16jmeqb7g"><span class="_13sjisp0"><h2 class="m0fuh0 m0fuh0 tlzusk2 tlzuske tlzuskv _16jmeqbak _16jmeqbco _16jmeqbes _16jmeqbgw _16jmeqb1e2 _16jmeqb1ef _16jmeqb1fg _16jmeqb1ec" data-heading-level="2">Footer navigation</h2></span><div class="_99wljg93 _16jmeqb3k _16jmeqb3p _16jmeqb3u _16jmeqb7k _16jmeqb7p _16jmeqb7u _16jmeqb1i4"><div class="_1kbq9x82 _1kbq9x84 _1kbq9x85 _1kbq9x88" style="--_1kbq9x80:var(--_99wljgf)"><nav class="" aria-label= eqb1ee _16jmeqb1ef" data-text-size="xs">Accessibility</span></span><svg viewBox="0 0 24 24" class=" nddnvd1 nddnvd8 nddnvda"><path fill="currentColor" fill-rule="evenodd" d="m10.492 3.702 7.55 7.548H2.25v1.875h15.791l-7.549 7.55 1.328 1.323 9.81-9.81-9.81-9.81-1.328 1.324Z" clip-rule="evenodd"></path></svg></span></a></li><li class=""><button class="_16jmeqb1g _16jmeqb1fg _16jmeqb1nk _16jmeqb1np" data-testid="cookie-settings-button-on-footer"><span class="_16jmeqb1w _16jmeqb10 _16jmeqb8 _16jmeqb1nk _16jmeqb1np"><span class="gv4p8b0 _16jmeqb1ee _16jmeqb1ef"><span class="gv4p8b0 tlzuska tlzuskm _16jmeqb1ee _16jmeqb1ef" data-text-size="xs">Cookie settings</span></span><svg viewBox="0 0 24 24" class=" nddnvd1 nddnvd8 nddnvda"><path fill="currentColor" d="M12.375 4.5V2.625H21V11.25H19.125V5.82562L13.2263 11.7262L11.8988 10.3987L17.7975 4.5H12.375ZM4.875 17.4206L10.7737 11.5219L12.1012 12.8494L6.2025 18.75H11.625V20.625H3V12H4.875V17.4206Z"></path></svg></span></button></li></ul></nav></div></footer></div><script data-testid="json-ld" type="application/ld+json">{"@context":"https://schema.org/","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Why has Elsevier decided that AI and AI-assisted tools cannot be credited as an author on published work?","acceptedAnswer":{"@type":"Answer","text":"Authorship implies responsibilities and tasks that can only be attributed to and performed by humans. Each (co-) author is accountable for ensuring that questions related to the accuracy or integrity of any part of the work are appropriately investigated and resolved and authorship requires the ability to approve the final version of the work and agree to its submission. Authors are also responsible for ensuring that the work is original, that the stated authors qualify for authorship, and the work does not infringe third party rights. Elsevier will monitor developments around generative AI and AI-assisted technologies and will adjust or refine this policy should it be appropriate."}},{"@type":"Question","name":"Does this policy cover tools that are used to check grammar and spelling, and reference managers that enable authors to collect and organize references to scholarly articles?","acceptedAnswer":{"@type":"Answer","text":"No, this policy does not cover tools such as spelling or grammar checkers. In addition, the policy does not cover reference managers that enable authors to collect, organize, annotate and use references to scholarly articles — such as Mendeley, EndNote, Zotero and others. These tools can be used by authors without disclosure. This policy is specific to AI and AI-assisted tools, such as Large Language Models, which can generate output that may be used to create a scientific work."}},{"@type":"Question","name":"Does this policy refer to AI and AI-assisted tools that are used in the research process, for example to process data?","acceptedAnswer":{"@type":"Answer","text":"No, this policy refers to generative AI and AI-assisted technologies, such as Large Language Models, when they are used during the scientific writing process. This policy does not prevent the use of AI and AI-assisted tools in formal research design or research methods. We recognize that this is common in many fields. Where AI or AI-assisted tools are used in this context, they should be described as part of the methodology of the work, with details provided in the Methods section."}},{"@type":"Question","name":"In which section of the manuscript should authors disclose the use of AI-assisted technologies, and where will this statement appear in the article if it is accepted for publication?","acceptedAnswer":{"@type":"Answer","text":"We ask authors who have used AI or AI-assisted tools to insert a statement at the end of their manuscript, immediately above the references, entitled ‘Declaration of Generative AI and AI-assisted technologies in the writing process’. In that statement, we ask authors to specify the tool that was used and the reason for using the tool. We suggest that authors follow this format when preparing their statement: During the preparation of this work the author(s) used [NAME TOOL / SERVICE] in order to [REASON]. After using this tool/service, the author(s) reviewed and edited the content as needed and take(s) full responsibility for the content of the publication."}},{"@type":"Question","name":"Can authors use AI-assisted tools to create or alter images that they publish in their work?","acceptedAnswer":{"@type":"Answer","text":"It is not acceptable to enhance, obscure, move, remove, or introduce a specific feature within an image. Adjustments of brightness, contrast, or color balance are acceptable if and as long as they do not obscure or eliminate any information present in the original. Manipulating images for improved clarity is accepted, but manipulation for other purposes could be seen as scientific ethical abuse and will be dealt with accordingly. In consideration of this, we do not permit the use of AI or AI-assisted tools to create or alter images in submitted manuscripts. The only exception is if the use of AI or AI-assisted tools in the creation or alteration of images is part of the research design or research methods. If this is done, we require a clear description of the content that was created or altered, an explanation of how the AI or AI-assisted tools were used in the creation or alteration process, and the name of the model or tool, version and extension numbers, and manufacturer."}},{"@type":"Question","name":"How does Elsevier handle copyright if the authors credit an AI or AI-assisted tool in their article?","acceptedAnswer":{"@type":"Answer","text":"AI and AI-assisted tools do not qualify for authorship under Elsevier’s authorship policy. Authors who use AI or AI-assisted tools during the manuscript writing process are asked to disclose their use in a separate section of the manuscript. The publishing agreement process works as usual, with the author transferring copyright to Elsevier or the society partner for subscription articles, and retaining copyright, granting a license to Elsevier and selecting an end user Creative Commons license for open access articles."}},{"@type":"Question","name":"Can you use output from AI agents or deep research directly as the text of your manuscript?","acceptedAnswer":{"@type":"Answer","text":"No, you cannot use output from AI agents or deep research directly as the text of your manuscript. AI output can only serve as inspiration in the manuscript preparation process, and any manuscript needs to represent the authors' authentic and original contribution and reflect the authors' own analysis, interpretation and ideas. Researchers should carefully check all AI-generated output for factual accuracy, comprehensiveness, and impartiality, and verify all sources."}},{"@type":"Question","name":"Does Elsevier allow the use of AI and AI-assisted technologies (“AI Tools”) tools, including AI agents and deep research, in the peer review and editorial decision-making process?","acceptedAnswer":{"@type":"Answer","text":"Currently, Elsevier does not permit or enable the use of AI technologies in the peer review process, nor do we allow AI Tools to make editorial decisions. Human oversight remains at the core of our decision-making, and editors are ultimately responsible for all editorial outcomes. \n\nHowever, we are actively exploring how AI can support our in-house editors in tasks such as manuscript screening. We remain open to the potential benefits that AI technology may offer in enhancing the peer review process in the future. \n\nImportantly, we believe that technology should serve as an aid to reviewers and editors, never as a substitute for human expertise and oversight. Our commitment is to ensure that editorial integrity and quality are maintained through responsible use of emerging technologies.\n"}}]}</script></div><script defer="" src="./Generative AI policies for journals_files/remove-no-j
