version: "3.9"

services:
  agent:
    build: .
    container_name: hallucination-agent
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - agent_data:/app/data

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  agent_data:
  ollama_data: