name: CI Pipeline (Docker + Evaluation)

on:
  push:
    branches: [main]

jobs:
  build-and-eval:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    # Step 1: Build Docker (proof of containerization)
    - name: Build Docker Image
      run: |
        docker build -t hallucination-agent .

    # Step 2: Setup Python for evaluation
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Build Vector DB
      run: |
        python vector_store.py
        
    # Step 3: Run evaluation gate
    - name: Run Evaluation Gate
      run: |
        python run_eval.py