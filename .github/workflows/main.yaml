name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-eval:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t agent .

    - name: Run Evaluation
      run: |
        pip install -r requirements.txt
        python run_eval.py